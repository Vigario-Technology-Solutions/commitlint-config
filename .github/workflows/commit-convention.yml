name: Commit convention

# Both ends of the convention, against one config — rule 7.
#
#   Validate PR title   pull_request.  A gate: it can block the merge.
#   Lint main           push.          A notification: the commit already exists.
#
# WHY BOTH, when squash-only means the title becomes the commit. Because
# `squash_merge_commit_title=PR_TITLE` PRE-FILLS the subject and does not bind it.
# Whoever merges can edit the field in the confirmation dialog, and the merge API
# takes a commit title as an argument — `gh pr merge --subject` exists for that
# reason. So the string this gate checked and the string that landed are not
# guaranteed to be the same string, and nothing runs in between.
#
# That makes the second job the only thing that ever sees what was actually
# written. It is not a backstop for exotic routes — a bypass push, an emergency
# `enforcement: disabled` — though it catches those too. An ordinary merge is
# equally unguarded.
#
# Lint main MUST NOT become a required status check. It cannot report on a
# pull_request event, so requiring it would leave every PR waiting on a context
# that will never arrive — rule 12 names that trap explicitly.
#
# Both jobs lint this repository against its OWN config. index.mjs is the package
# and the configuration at once, so a change that breaks conforming commits fails
# here before it reaches a consumer — the config is its own first consumer.

on:
  pull_request:
    # `edited` re-runs when the title changes, so fixing a bad title turns the
    # check green without needing an empty commit to re-trigger it.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  # contents only. The title is read from the event payload, not fetched from the
  # pull request API, so nothing here needs pull-requests: read.
  contents: read

jobs:
  validate:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # commitlint reads the piped string and the config file; it needs no
          # git history.
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts because there are none, and because a docs repository
      # should never execute package lifecycle scripts in CI.
      - run: npm ci --ignore-scripts

      - name: Run commitlint on the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # printf rather than echo: a title beginning with `-n` or `-e` is eaten
        # by POSIX echo as a flag, so commitlint would validate a truncated
        # string and pass something that should have failed.
        run: printf '%s\n' "$TITLE" | npx --no-install commitlint --verbose

  main:
    name: Lint main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the range below asks what landed, and a depth of 1
          # cannot answer that for a push carrying more than one commit.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # LIMIT, measured rather than assumed: commitlint's default ignores skip merge
      # commits, so `Merge pull request #1 from ...` passes this with zero problems.
      # Nothing here can catch one. `required_linear_history` in the ruleset is what
      # keeps them off the branch, and this check is not a second line of defence
      # against them.
      - name: Lint every subject that landed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # A branch's first push reports an all-zero `before`, and a force-push
          # can report one that is no longer reachable. Either way the range is
          # unanswerable, so fall back to the single commit that arrived rather
          # than failing on the lookup — a check that errors on its own inputs
          # reports nothing about the record it exists to protect.
          # Three ways the range can be meaningless, and they look alike from inside
          # the job: an all-zero `before` on a branch's first push, a `before` whose
          # object is gone, and a `before` that still EXISTS but is no longer an
          # ancestor of `after` — what a force-push leaves behind. The last is the
          # dangerous one: the range resolves, nothing errors, and it expands to
          # every commit not shared between the two tips. Ancestry is the question,
          # not existence.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || ! git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            echo "no reachable range; linting the head commit only"
            npx --no-install commitlint --last --verbose
          else
            npx --no-install commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi
